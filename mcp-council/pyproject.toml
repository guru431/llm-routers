[project]
name = "mcp-council"
version = "0.1.0"
description = "MCP server: Karpathy 3-stage council of 7 LLMs (GLM/Kimi/DeepSeek/Qwen/MiniMax/Gemini/Codex). Returns materials for synthesis by main agent."
requires-python = ">=3.10"
dependencies = [
    # ВЕРХНЯЯ ГРАНИЦА ОБЯЗАТЕЛЬНА. `mcp` 2.0.0 (PyPI, конец 2026-07) выкинул
    # `mcp.server.fastmcp` — на его месте `mcp.server.mcpserver`. server.py
    # импортирует `from mcp.server.fastmcp import FastMCP`, поэтому на 2.x весь
    # сьют падает с ModuleNotFoundError ещё на импорте. Спека `>=1.0` без потолка
    # это и допустила: локально стоял 1.26.0 и всё было зелёным, а CI ставил
    # зависимости заново и приносил 2.0.0. Снимать потолок только вместе с
    # миграцией на API 2.x.
    "mcp[cli]>=1.0,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat module layout: the server is a set of top-level modules (server.py,
# council.py, critique.py, …) plus the dialogue/ package — there is no
# `mcp_council/` directory, so hatchling's default heuristics cannot infer what
# to ship and the build fails outright ("Unable to determine which files to ship
# inside the wheel"). That took `pip install -e "mcp-council[dev]"` down, which is
# how both the README and CI install this package. Declare the selection instead.
# Tests and runtime logs are deliberately not part of the distribution.
[tool.hatch.build.targets.wheel]
include = ["*.py", "dialogue"]
exclude = ["tests", "logs"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
